<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf Bootstrap Template</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Header Section -->
<div th:replace="fragments/header :: header"></div>

<!-- Main Content Section -->
<div class="container my-5">
    <h1 class="mb-4">Books List</h1>
    <div class="row">
        <div class="col-md-4" th:each="book : ${books}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.subject}">Book Subject</h5>
                    <p class="card-subtitle mb-2 text-muted" th:text="${book.author}">Author Name</p>
                    <p class="card-text">
                        Price: <span th:text="${book.price}">30000</span><br>
                        Pages: <span th:text="${book.page}">600</span><br>
                        Created At: <span th:text="${book.createdAt}">2024-08-04</span>
                    </p>
                    <a href="#" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer Section -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
